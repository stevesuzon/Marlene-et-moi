name = "marlene-et-moi"
compatibility_date = "2026-10-04"

[build]
command = "rm -rf site && mkdir -p site && unzip -o Marlene-et-moi-GitHub-Cloudflare.zip -d site && cp clean-v2/index.html site/public/index.html && cp clean-v2/styles.css site/public/styles.css && cp clean-v2/app.js site/public/app.js && cp clean-v2/sw.js site/public/sw.js"

[assets]
directory = "./site/public"
