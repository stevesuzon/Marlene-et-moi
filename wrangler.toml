name = "marlene-et-moi"
compatibility_date = "2026-10-04"
main = "./src/index.js"

[build]
command = "rm -rf site && mkdir -p site && unzip -o Marlene-et-moi-GitHub-Cloudflare.zip -d site && cp public/index.html site/public/index.html && cp public/sw.js site/public/sw.js"

[assets]
directory = "./site/public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SHOP"
class_name = "ShopState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShopState"]
